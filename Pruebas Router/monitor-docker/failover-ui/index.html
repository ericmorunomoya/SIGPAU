<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Failover Control Center</title>
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background: #ef4444;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 10px #ef4444;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        button {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 10px 15px -3px rgba(79, 172, 254, 0.4);
            transition: all 0.2s ease;
        }

        button:hover {
            filter: brightness(1.1);
            box-shadow: 0 20px 25px -5px rgba(79, 172, 254, 0.5);
            transform: scale(1.02);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
        }

        #message {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .success { color: #22c55e; }
        .error { color: #f43f5e; }
    </style>
</head>
<body>
    <div class="container">
        <div style="margin-bottom: 1rem;">
            <span class="status-dot"></span>
            <span style="font-weight: 500;">Alerta: Servidor Caído</span>
        </div>
        <h1>Control de Failover</h1>
        <p>Se ha detectado una interrupción en el router principal. ¿Deseas activar la infraestructura de respaldo?</p>
        
        <button id="btnAction" onclick="triggerFailover()">LEVANTAR ROUTER BACKUP</button>
        
        <div id="message"></div>
    </div>

    <script>
        async function triggerFailover() {
            const btn = document.getElementById('btnAction');
            const msg = document.getElementById('message');
            
            btn.disabled = true;
            btn.innerText = "PROCESANDO...";
            msg.innerText = "";

            try {
                // Llamamos directamente al Bridge del Host (9001)
                // Usamos el puerto 9001 que abrirá nuestro script de PowerShell
                const response = await fetch('http://localhost:9001/start-backup', {
                    method: 'POST',
                    mode: 'cors'
                });

                if (response.ok) {
                    msg.innerHTML = '<span class="success">✓ Backup iniciado correctamente</span>';
                    btn.innerText = "INFRAESTRUCTURA ACTIVA";
                } else {
                    throw new Error();
                }
            } catch (error) {
                msg.innerHTML = '<span class="error">✕ Error: No se pudo contactar con el Host</span>';
                btn.disabled = false;
                btn.innerText = "REINTENTAR LEVANTAR";
            }
        }
    </script>
</body>
</html>
