version: '3.8'

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: always
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "3001:3001"
    networks:
      - failover-net

  failover-ui:
    build: ./failover-ui
    container_name: failover-ui
    restart: always
    ports:
      - "3002:80"
    environment:
      - HOST_BRIDGE_URL=http://host.docker.internal:9001/start-backup
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - failover-net

networks:
  failover-net:
    driver: bridge

volumes:
  uptime-kuma-data:
